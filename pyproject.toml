[project]
name = "cs422-assignment-2"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "pydantic>=2.13.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
